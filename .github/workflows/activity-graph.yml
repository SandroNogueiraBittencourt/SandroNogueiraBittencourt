name: Generate Activity Graph

on:
  schedule:
    - cron: "15 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: SandroNogueiraBittencourt
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: profile-summary-card-output/tokyonight/activity-graph.svg

      - name: Commit Activity Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/tokyonight/activity-graph.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no gráfico."
          else
            git commit -m "chore: atualiza gráfico de contribuições"
            git push
          fi
